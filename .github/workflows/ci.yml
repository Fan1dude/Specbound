name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax-and-references:
    name: Syntax + broken-reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ci/check-syntax.js
      - run: node tools/ci/check-references.js
      - run: node tools/ci/check-a11y-regressions.js
      - run: node tools/ci/check-csp-bootstrap.js
      - run: node tools/ci/check-production-domain.js
      - run: node tools/ci/check-auth-redirects.js
      - run: node tools/ci/check-security-headers.js
      - run: node tools/ci/check-crawl-policy.js

  browser-tests:
    name: Browser test suite (tests/*.test.html)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CI-only tooling (playwright)
        working-directory: tools/ci
        run: npm install
      - name: Install headless Chromium
        working-directory: tools/ci
        run: npx playwright install --with-deps chromium
      - run: node tools/ci/run-tests.js
