<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 6B — search page (debounce, stale-request, states)</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 6B — search page (debounce, stale-request, states)</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <nav id="navbar"></nav>
    <input id="searchPageInput" type="search">
    <section id="searchResults"></section>
    <footer id="footer"></footer>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        // --- Mock state -----------------------------------------------------
        const calls = [];
        // Maps a query string to an artificial resolve delay (ms) — lets the
        // test fire a "slow, old" query followed by a "fast, new" one and
        // confirm the old one's late arrival never overwrites the new one's
        // results, which is exactly what stale-request protection exists for.
        const delaysByQuery = {};
        let resultsByQuery = {};
        let shouldFail = false;

        globalThis.__mock = {
            calls,
            get delaysByQuery() { return delaysByQuery; },
            get resultsByQuery() { return resultsByQuery; },
            get shouldFail() { return shouldFail; }
        };

        const layoutSrc = `export function loadNavbar() {} export function loadFooter() {}`;

        const buildRepoSrc = `
            export async function searchBuilds(query) {
                globalThis.__mock.calls.push(["searchBuilds", query]);
                const delay = globalThis.__mock.delaysByQuery[query] ?? 0;
                await new Promise(r => setTimeout(r, delay));
                if (globalThis.__mock.shouldFail) throw new Error("search failed");
                return globalThis.__mock.resultsByQuery[query] || [];
            }
        `;

        const mediaRepoSrc = `
            export async function resolveBuildImageUrls(builds) { return builds; }
        `;

        const profileRepoSrc = `
            export async function getProfilesByIds(ids) {
                return ids.map(id => ({ id, username: "user-" + id }));
            }
        `;

        // BlueprintFeed/BlueprintCard deliberately left real — actual card
        // rendering is part of what this test verifies. They still need an
        // absolute-URL rewrite though: blob: URLs have no meaningful
        // directory for "../../components/..." to resolve against (the same
        // bug hit and fixed twice already this project — see
        // editorPublishUnpublish.test.html / restoreButton.test.html).
        const componentsOrigin = new URL("../js/components/", location.href).href;

        const rewrites = {
            '"../../core/layout.js"': blobUrl(layoutSrc),
            '"../../repositories/buildRepository.js"': blobUrl(buildRepoSrc),
            '"../../repositories/mediaRepository.js"': blobUrl(mediaRepoSrc),
            '"../../repositories/profileRepository.js"': blobUrl(profileRepoSrc),
            '"../../components/BlueprintFeed.js"': new URL("BlueprintFeed.js", componentsOrigin).href
        };

        const pageScriptPromise = (async () => {
            const realSrc = await (await fetch("../js/pages/search/app.js")).text();
            let rewritten = realSrc;
            for (const [from, to] of Object.entries(rewrites)) {
                rewritten = rewritten.replaceAll(from, `"${to}"`);
            }
            return rewritten;
        })();

        // Only ever imported into a FRESH #searchPageInput/#searchResults
        // pair, never the same persistent elements twice — the module
        // attaches its "input" listener (and its own private debounceTimer)
        // to whatever element has that id at import time. Re-importing
        // against the same still-attached element would leave two
        // independent listeners on it, corrupting the debounce test that
        // follows (this is exactly what happened before this fix: two
        // listeners, each with their own timer, each firing their own
        // "final value" search).
        async function loadPageScript(initialSearch) {
            history.replaceState(null, "", location.pathname + initialSearch);

            document.getElementById("searchPageInput")?.remove();
            document.getElementById("searchResults")?.remove();

            const freshInput = document.createElement("input");
            freshInput.id = "searchPageInput";
            freshInput.type = "search";

            const freshResults = document.createElement("section");
            freshResults.id = "searchResults";

            document.body.appendChild(freshInput);
            document.body.appendChild(freshResults);

            await import(blobUrl(await pageScriptPromise));

            return { input: freshInput, resultsEl: freshResults };
        }

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        let input;
        let resultsEl;

        function setInput(value) {
            input.value = value;
            input.dispatchEvent(new Event("input"));
        }

        // --- Case 1: page loads with ?q= too short (1 char) — shows the
        //     neutral prompt, makes zero calls ---------------------------
        // Its own isolated load/elements — this scenario is done with after
        // this block, so it doesn't need to share state with what follows.
        {
            const page1 = await loadPageScript("?q=a");
            await new Promise(r => setTimeout(r, 100));

            test("a 1-character initial ?q= does not trigger a search", calls.length === 0, JSON.stringify(calls));
            test("shows the neutral prompt for a too-short query", page1.resultsEl.textContent.includes("Type something to search"), page1.resultsEl.textContent);
        }

        // --- Case 2: page loads with a valid ?q= — runs immediately, no
        //     debounce delay. This load's elements are reused through the
        //     rest of the cases below (one continuous "session"). ----------
        calls.length = 0;
        resultsByQuery = { arduino: [{ id: "b1", title: "Arduino Weather Station", slug: "b1", user_id: "u1", visibility: "public" }] };

        ({ input, resultsEl } = await loadPageScript("?q=arduino"));
        await waitFor(() => calls.some(c => c[0] === "searchBuilds"));
        await waitFor(() => document.querySelectorAll(".blueprint-card").length === 1);

        test("initial load with a valid ?q= runs a search immediately (no debounce wait)", calls.some(c => c[1] === "arduino"));
        test("the input is pre-filled from ?q=", input.value === "arduino");
        test("a matching result renders as a real Blueprint card", document.querySelectorAll(".blueprint-card").length === 1);

        // --- Case 3: typing debounces — rapid keystrokes fire one search, not one per keystroke ---
        calls.length = 0;
        resultsByQuery = { "raspberry pi": [] };

        setInput("r");
        setInput("ra");
        setInput("ras");
        setInput("rasp");
        setInput("raspberry pi");

        await new Promise(r => setTimeout(r, 100)); // well under the debounce window
        test("mid-typing (before the debounce window elapses), no search has fired yet", calls.length === 0, JSON.stringify(calls));

        await waitFor(() => calls.length > 0, 1000);
        await new Promise(r => setTimeout(r, 50));
        test("after the debounce window, exactly one search fires — for the final value, not each keystroke", calls.length === 1 && calls[0][1] === "raspberry pi", JSON.stringify(calls));

        // --- Case 4: URL is kept in sync as the user types (debounced) -----
        test("the URL's ?q= reflects the final typed value after debounce", new URL(location.href).searchParams.get("q") === "raspberry pi", location.href);

        // --- Case 5: sub-2-char input clears results back to the prompt and updates the URL ---
        calls.length = 0;
        setInput("x");
        await new Promise(r => setTimeout(r, 400));

        test("typing back down to 1 character shows the prompt again", resultsEl.textContent.includes("Type something to search"), resultsEl.textContent);
        test("a sub-minimum query still updates the URL (preserves what was typed)", new URL(location.href).searchParams.get("q") === "x", location.href);
        test("a sub-minimum query makes no search call", calls.length === 0, JSON.stringify(calls));

        // --- Case 6: stale-request protection — a slow old response must not
        //     overwrite a fast new one that was issued after it -------------
        // Timing note: with a single shared debounce timer, two different
        // search terms can only both reach "request in flight" if the first
        // one's debounce has already fired (started its network call)
        // before the second is typed — typing sooner would just cancel the
        // first via clearTimeout, never issuing it at all. So: type "slow
        // query", wait past its 300ms debounce (so its request actually
        // starts), then type "fast query". For genuine overlap, "slow
        // query"'s own artificial network delay has to still be pending
        // when "fast query"'s debounce fires 300ms later — hence 600ms,
        // comfortably longer than 300 (debounce) + 10 (fast query's delay).
        calls.length = 0;
        delaysByQuery["slow query"] = 600;
        delaysByQuery["fast query"] = 10;
        resultsByQuery["slow query"] = [{ id: "old", title: "OLD STALE RESULT", slug: "old", user_id: "u1", visibility: "public" }];
        resultsByQuery["fast query"] = [{ id: "new", title: "NEW RESULT", slug: "new", user_id: "u1", visibility: "public" }];

        setInput("slow query");
        await new Promise(r => setTimeout(r, 320)); // past the 300ms debounce — "slow query"'s network call has started
        setInput("fast query");

        await waitFor(() => resultsEl.textContent.includes("NEW RESULT"), 1500);
        // Give the slow, stale response every chance to land and (incorrectly) overwrite the UI.
        await new Promise(r => setTimeout(r, 600));

        test(
            "the newer, faster search's results are what's on screen",
            resultsEl.textContent.includes("NEW RESULT"),
            resultsEl.textContent
        );
        test(
            "the older, slower search's results never appear, even though it resolved after the newer one started",
            !resultsEl.textContent.includes("OLD STALE RESULT"),
            resultsEl.textContent
        );

        // --- Case 7: loading state is shown while a search is in flight -----
        calls.length = 0;
        delaysByQuery["loading test"] = 200;
        resultsByQuery["loading test"] = [];
        setInput("loading test");
        await new Promise(r => setTimeout(r, 320)); // debounce elapses, request starts, not yet resolved
        test("a \"Searching...\" state is visible while the request is in flight", resultsEl.textContent.includes("Searching"), resultsEl.textContent);
        await waitFor(() => !resultsEl.textContent.includes("Searching"), 1000);

        // --- Case 8: zero results shows an empty state naming the query -----
        calls.length = 0;
        resultsByQuery["nothing here"] = [];
        setInput("nothing here");
        await waitFor(() => calls.some(c => c[1] === "nothing here"));
        await waitFor(() => resultsEl.textContent.includes("No Projects Found") || resultsEl.textContent.includes("nothing here"));
        test("zero results shows an empty state naming the query", resultsEl.textContent.includes("nothing here"), resultsEl.textContent);

        // --- Case 9: a thrown search error shows a visible error state -----
        calls.length = 0;
        shouldFail = true;
        setInput("will error");
        await waitFor(() => resultsEl.textContent.toLowerCase().includes("wrong") || resultsEl.textContent.toLowerCase().includes("unavailable"), 1000);
        test("a search failure shows a visible error message, not a silent blank result", resultsEl.textContent.toLowerCase().includes("wrong") || resultsEl.textContent.toLowerCase().includes("unavailable"), resultsEl.textContent);
        shouldFail = false;

        // --- Render + report ------------------------------------------------
        const resultsListEl = document.getElementById("results");
        resultsListEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`searchPage.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
