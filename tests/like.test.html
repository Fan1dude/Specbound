<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 6D — likes</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 6D — likes</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <button type="button" id="likeBtn" aria-pressed="false" disabled>
        <span id="likeCount">0</span>
    </button>
    <p id="likeHint" hidden></p>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        // --- Mock state -----------------------------------------------------
        const calls = [];
        const toastMessages = [];
        let mockHasLiked = false;
        let hasLikedShouldFail = false;
        let setLikeShouldFail = false;
        let setLikeErrorMessage = "Could not update your like.";
        // Lets a test simulate the server returning a different authoritative
        // state than what the client optimistically guessed (drift, e.g. a
        // second tab already changed it) — null means "just echo back what
        // was requested," the normal case.
        let setLikeResultOverride = null;

        globalThis.__mock = {
            calls, toastMessages,
            get mockHasLiked() { return mockHasLiked; },
            get hasLikedShouldFail() { return hasLikedShouldFail; },
            get setLikeShouldFail() { return setLikeShouldFail; },
            get setLikeErrorMessage() { return setLikeErrorMessage; },
            get setLikeResultOverride() { return setLikeResultOverride; }
        };

        const likeRepoSrc = `
            export async function hasLikedBuild(buildId) {
                globalThis.__mock.calls.push(["hasLikedBuild", buildId]);
                if (globalThis.__mock.hasLikedShouldFail) throw new Error("network down");
                return globalThis.__mock.mockHasLiked;
            }
            export async function setBuildLike(buildId, liked) {
                globalThis.__mock.calls.push(["setBuildLike", buildId, liked]);
                if (globalThis.__mock.setLikeShouldFail) throw new Error(globalThis.__mock.setLikeErrorMessage);
                const override = globalThis.__mock.setLikeResultOverride;
                if (override) return override;
                return { liked, likesCount: liked ? 6 : 5 };
            }
        `;

        const toastSrc = `
            export function showToast(message, type) {
                globalThis.__mock.toastMessages.push({ message, type });
            }
        `;

        const rewrites = {
            '"../../repositories/likeRepository.js"': blobUrl(likeRepoSrc),
            '"../../core/toast.js"': blobUrl(toastSrc)
        };

        const realSrc = await (await fetch("../js/pages/build/renderLike.js")).text();
        let rewritten = realSrc;
        for (const [from, to] of Object.entries(rewrites)) {
            rewritten = rewritten.replaceAll(from, `"${to}"`);
        }

        const { renderLike } = await import(blobUrl(rewritten));

        const button = document.getElementById("likeBtn");
        const countEl = document.getElementById("likeCount");
        const hint = document.getElementById("likeHint");

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        const publicBuild = { id: "build-1", visibility: "public", likes_count: 5 };
        const privateBuild = { id: "build-2", visibility: "private", likes_count: 0 };

        // --- Case 1: signed out — button disabled, sign-in hint, real count shown ---
        await renderLike(publicBuild, null);

        test("signed out: button is disabled", button.disabled === true);
        test("signed out: the count still shows builds.likes_count", countEl.textContent === "5");
        test("signed out: a visible sign-in hint is shown (not a title attribute)", !hint.hidden && hint.textContent.includes("Sign in"));
        test("signed out: no hasLikedBuild call is made", !calls.some(c => c[0] === "hasLikedBuild"));

        // --- Case 2: signed in, public project, not yet liked ----------------
        calls.length = 0;
        mockHasLiked = false;
        const userA = { id: "user-a" };

        await renderLike(publicBuild, userA);

        test("signed in + public: button is enabled", button.disabled === false);
        test("signed in + public: hint is hidden", hint.hidden === true);
        test("not-yet-liked: button does not start in the liked state", button.classList.contains("is-liked") === false && button.getAttribute("aria-pressed") === "false");
        test("initial like status is checked for the signed-in user", calls.some(c => c[0] === "hasLikedBuild" && c[1] === "build-1"));

        // --- Case 3: click to like — optimistic update, then reconciled ------
        calls.length = 0;
        button.click();

        // Immediately after the click (before the async call resolves), the
        // optimistic UI should already reflect "liked" and count+1.
        test("optimistic update: button shows liked immediately on click", button.classList.contains("is-liked") === true);
        test("optimistic update: count increments immediately on click", countEl.textContent === "6");
        test("optimistic update: the button is disabled while the request is in flight", button.disabled === true);

        await waitFor(() => calls.some(c => c[0] === "setBuildLike"));
        await waitFor(() => button.disabled === false);

        test("liking calls setBuildLike(buildId, true)", calls.some(c => c[0] === "setBuildLike" && c[1] === "build-1" && c[2] === true));
        test("after success, state is reconciled from the server's authoritative response", button.classList.contains("is-liked") === true && countEl.textContent === "6");
        test("the button is re-enabled after a successful request", button.disabled === false);

        // --- Case 4: click again to unlike -------------------------------
        calls.length = 0;
        button.click();

        test("optimistic update: button shows unliked immediately on second click", button.classList.contains("is-liked") === false);
        test("optimistic update: count decrements immediately on second click", countEl.textContent === "5");

        await waitFor(() => calls.some(c => c[0] === "setBuildLike"));
        await waitFor(() => button.disabled === false);

        test("unliking calls setBuildLike(buildId, false)", calls.some(c => c[0] === "setBuildLike" && c[1] === "build-1" && c[2] === false));
        test("after unlike success, state settles back to unliked", button.classList.contains("is-liked") === false && countEl.textContent === "5");

        // --- Case 5: a click while a request is already in flight is ignored ---
        calls.length = 0;
        button.click(); // starts a real (mocked, async) request
        const callsRightAfterFirstClick = calls.length;
        button.click(); // fired while button.disabled is true
        await waitFor(() => button.disabled === false);

        test("a second click while disabled does not start a second request", calls.filter(c => c[0] === "setBuildLike").length === 1, JSON.stringify(calls));

        // --- Case 6: failed like request rolls back the optimistic UI --------
        calls.length = 0;
        toastMessages.length = 0;
        setLikeShouldFail = true;
        setLikeErrorMessage = "This project is not available for likes.";

        const countBeforeFailure = countEl.textContent;
        const likedBeforeFailure = button.classList.contains("is-liked");

        button.click();
        await waitFor(() => toastMessages.length > 0);

        test("a failed request rolls back the optimistic like state", button.classList.contains("is-liked") === likedBeforeFailure);
        test("a failed request rolls back the optimistic count", countEl.textContent === countBeforeFailure);
        test("a failed request surfaces the actual server error via toast", toastMessages.some(t => t.type === "error" && t.message === "This project is not available for likes."));
        test("the button is re-enabled after a failed request", button.disabled === false);

        setLikeShouldFail = false;

        // --- Case 7: signed in, but the project is private (owner preview) ---
        calls.length = 0;
        mockHasLiked = false;

        await renderLike(privateBuild, userA);

        test("signed in + private build: button is disabled", button.disabled === true);
        test("signed in + private build: a visible hint explains why (not a title attribute)", !hint.hidden && hint.textContent.includes("public"));
        test("signed in + private build: no hasLikedBuild call is made (nothing to check)", !calls.some(c => c[0] === "hasLikedBuild"));

        // --- Case 8: hasLikedBuild failing fails soft, doesn't block the page ---
        calls.length = 0;
        hasLikedShouldFail = true;

        await renderLike(publicBuild, userA);

        test("a failed initial like-status check does not throw and defaults to unliked", button.classList.contains("is-liked") === false);
        test("the button is still usable after a failed initial status check", button.disabled === false);
        test("the count still renders from builds.likes_count even if the status check fails", countEl.textContent === "5");

        hasLikedShouldFail = false;

        // --- Case 9: signed in, already liked — button starts in the liked state ---
        calls.length = 0;
        mockHasLiked = true;

        await renderLike(publicBuild, userA);

        test("already-liked: button starts in the liked visual state", button.classList.contains("is-liked") === true && button.getAttribute("aria-pressed") === "true");
        test("already-liked: button is still enabled (can be un-clicked)", button.disabled === false);

        mockHasLiked = false;

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`like.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
