<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>draftValidation.js — test matrix</title>
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        h1 { font-size: 1.1rem; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin-top: 16px; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>draftValidation.js — test matrix</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <script type="module">
        import {
            getReadinessChecks,
            isValidTitle,
            isValidDescription,
            isDraftReady
        } from "../js/services/draftValidation.js";

        const results = [];

        function test(name, actual, expected) {
            const pass = JSON.stringify(actual) === JSON.stringify(expected);
            results.push({ name, pass, actual, expected });
        }

        // --- isValidTitle -----------------------------------------------
        test("title: undefined -> false", isValidTitle(undefined), false);
        test("title: null -> false", isValidTitle(null), false);
        test("title: empty string -> false", isValidTitle(""), false);
        test("title: whitespace only -> false", isValidTitle("   "), false);
        test("title: 2 chars (below min) -> false", isValidTitle("Hi"), false);
        test("title: exactly 3 chars (min boundary) -> true", isValidTitle("Abc"), true);
        test("title: normal valid title -> true", isValidTitle("A Real Project Title"), true);
        test("title: exactly 100 chars (max boundary) -> true", isValidTitle("A".repeat(100)), true);
        test("title: 101 chars (over max) -> false", isValidTitle("A".repeat(101)), false);
        test("title: leading/trailing whitespace trimmed -> true", isValidTitle("  Valid Title  "), true);

        // --- isValidDescription ------------------------------------------
        test("description: undefined -> false", isValidDescription(undefined), false);
        test("description: empty string -> false", isValidDescription(""), false);
        test("description: 9 chars (too short) -> false", isValidDescription("Too short"), false);
        test("description: 19 chars (just under min) -> false", isValidDescription("1234567890123456789"), false);
        test("description: exactly 20 chars (min boundary) -> true", isValidDescription("12345678901234567890"), true);
        test("description: normal valid description -> true", isValidDescription("This is a properly detailed project description."), true);
        test("description: whitespace padding trims to valid -> true", isValidDescription("   12345678901234567890   "), true);

        // --- getReadinessChecks: structure --------------------------------
        const structureCheck = getReadinessChecks({ title: "Valid Title", description: "A description that is definitely long enough.", category: "pc_build", hasCoverImage: true });
        test(
            "getReadinessChecks: returns 4 checks with expected keys",
            structureCheck.map(c => c.key),
            ["title", "description", "category", "cover"]
        );

        // --- getReadinessChecks + isDraftReady: combinations --------------
        const validTitle = "A Real Project Title";
        const validDescription = "This is a properly detailed project description.";

        function passedCount(checks) {
            return checks.filter(c => c.passed).length;
        }

        // All missing
        const allMissing = getReadinessChecks({ title: "", description: "", category: "", hasCoverImage: false });
        test("all missing -> 0 of 4 passed", passedCount(allMissing), 0);
        test("all missing -> isDraftReady false", isDraftReady(allMissing), false);

        // All present
        const allPresent = getReadinessChecks({ title: validTitle, description: validDescription, category: "pc_build", hasCoverImage: true });
        test("all present -> 4 of 4 passed", passedCount(allPresent), 4);
        test("all present -> isDraftReady true", isDraftReady(allPresent), true);

        // Only title missing
        const onlyTitleMissing = getReadinessChecks({ title: "", description: validDescription, category: "pc_build", hasCoverImage: true });
        test("only title missing -> 3 of 4 passed", passedCount(onlyTitleMissing), 3);
        test("only title missing -> isDraftReady false", isDraftReady(onlyTitleMissing), false);

        // Only description missing
        const onlyDescriptionMissing = getReadinessChecks({ title: validTitle, description: "", category: "pc_build", hasCoverImage: true });
        test("only description missing -> 3 of 4 passed", passedCount(onlyDescriptionMissing), 3);
        test("only description missing -> isDraftReady false", isDraftReady(onlyDescriptionMissing), false);

        // Only category missing
        const onlyCategoryMissing = getReadinessChecks({ title: validTitle, description: validDescription, category: "", hasCoverImage: true });
        test("only category missing -> 3 of 4 passed", passedCount(onlyCategoryMissing), 3);
        test("only category missing -> isDraftReady false", isDraftReady(onlyCategoryMissing), false);

        // Only cover missing
        const onlyCoverMissing = getReadinessChecks({ title: validTitle, description: validDescription, category: "pc_build", hasCoverImage: false });
        test("only cover missing -> 3 of 4 passed", passedCount(onlyCoverMissing), 3);
        test("only cover missing -> isDraftReady false", isDraftReady(onlyCoverMissing), false);

        // Two present, two missing
        const halfComplete = getReadinessChecks({ title: validTitle, description: validDescription, category: "", hasCoverImage: false });
        test("title+description present, category+cover missing -> 2 of 4 passed", passedCount(halfComplete), 2);
        test("half complete -> isDraftReady false", isDraftReady(halfComplete), false);

        // --- Render + report ----------------------------------------------
        const resultsEl = document.getElementById("results");

        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (expected ${JSON.stringify(r.expected)}, got ${JSON.stringify(r.actual)})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };

        console.log(`draftValidation.test.html: ${passCount}/${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`);
    </script>
</body>
</html>
