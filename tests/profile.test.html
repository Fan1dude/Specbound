<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 20 — profile orchestrator</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 20 — profile orchestrator (renderProfile.js)</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <!-- Fixture DOM — must match pages/profile.html's real ids exactly,
         since every render*.js section function targets these by id. -->
    <main id="fixture">
        <section class="profile-hero" id="profileHero">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-hero-info">
                <h1 id="profileUsername">Loading...</h1>
                <p id="profileDisplayName" hidden></p>
                <p id="profileHeadline" hidden></p>
                <div id="profileMeta"></div>
                <div id="profileLinks"></div>
                <div id="profileFollowCounts"></div>
                <button id="followBtn" hidden>Follow</button>
                <p id="followHint" hidden></p>
            </div>
        </section>

        <section id="profileOverview">
            <div id="profileStats"></div>
            <div id="profileTechFocus" hidden></div>
        </section>

        <section id="profileEmptyState" hidden>
            <p>Your published projects will show up here.</p>
            <a href="../pages/upload.html">Publish Your First Build</a>
        </section>

        <section id="profileFeatured" hidden></section>

        <section id="profileGallery" hidden>
            <div id="profileGalleryFilters"></div>
            <select id="profileGallerySort"></select>
            <div id="profileBuilds"></div>
            <button id="profileGalleryLoadMore" hidden>Load more</button>
        </section>

        <section id="profileTechBreakdown" hidden></section>
        <section id="profileJourney" hidden></section>
        <section id="profileAbout" hidden></section>
    </main>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        function absUrl(path) {
            return new URL(path, location.href).href;
        }

        // Rewrites every relative import specifier in `src` to an absolute
        // URL via `map` ({ "./x.js": "../js/pages/profile/x.js", ... }),
        // then returns a ready-to-import blob URL. Mirrors the technique
        // established in the pre-Milestone-20 version of this test file —
        // a blob module has no real location, so every relative import it
        // contains must be resolved to an absolute (real-file or
        // mock-blob) URL before it can run.
        async function loadPatched(realPath, map) {
            const src = await (await fetch(realPath)).text();
            let rewritten = src;
            for (const [from, to] of Object.entries(map)) {
                rewritten = rewritten.replaceAll(`"${from}"`, `"${to}"`);
            }
            return blobUrl(rewritten);
        }

        // --- Mocks: real network-touching modules, stubbed same as before ---
        let mockAvatarUrl = "";
        globalThis.__mock = { get mockAvatarUrl() { return mockAvatarUrl; } };

        const mediaRepoMockUrl = blobUrl(`
            export async function resolveAvatarUrl(profile) {
                return globalThis.__mock.mockAvatarUrl;
            }
        `);

        const renderFollowMockUrl = blobUrl(`export async function renderFollow() {}`);

        // ManageRolesControl.js is Milestone 22's moderator/staff-only
        // grant/revoke UI — never exercised by this test (which covers
        // section visibility, not moderator actions), so it's mocked as
        // a no-op the same way renderFollow.js is above, rather than
        // pulling in its own real network-touching import
        // (communityRepository.js).
        const manageRolesControlMockUrl = blobUrl(`export function renderManageRoles() {}`);

        // renderProfileHero.js has its own transitive import of
        // mediaRepository.js (a real Supabase call) — patched the same way
        // as the top-level orchestrator below, one level deeper.
        const renderProfileHeroUrl = await loadPatched("../js/pages/profile/renderProfileHero.js", {
            "../../repositories/mediaRepository.js": mediaRepoMockUrl,
            "../../utils/escapeHtml.js": absUrl("../js/utils/escapeHtml.js"),
            "../../utils/avatarInitial.js": absUrl("../js/utils/avatarInitial.js"),
            "../../utils/icons.js": absUrl("../js/utils/icons.js"),
            "./formatJoinDate.js": absUrl("../js/pages/profile/formatJoinDate.js"),
            // Milestone 22 — RoleBadge.js (and its own transitive import,
            // communityRecognition.js) are pure/DOM-only, same reasoning
            // as every other section component below.
            "../../components/RoleBadge.js": absUrl("../js/components/RoleBadge.js")
        });

        // Every other section component has no network-touching imports
        // (escapeHtml, icons, formatCategory, technologies config,
        // BlueprintCard, progressBar are all pure/DOM-only) — loaded via
        // their real absolute file URL as-is, same reasoning as the old
        // test using the real BlueprintCard.js directly.
        const renderProfileUrl = await loadPatched("../js/pages/profile/renderProfile.js", {
            "./renderProfileHero.js": renderProfileHeroUrl,
            "./renderFollow.js": renderFollowMockUrl,
            "./renderBuilderOverview.js": absUrl("../js/pages/profile/renderBuilderOverview.js"),
            "./renderFeaturedProject.js": absUrl("../js/pages/profile/renderFeaturedProject.js"),
            "./renderProjectGallery.js": absUrl("../js/pages/profile/renderProjectGallery.js"),
            "./renderTechnologyBreakdown.js": absUrl("../js/pages/profile/renderTechnologyBreakdown.js"),
            "./renderBuilderJourney.js": absUrl("../js/pages/profile/renderBuilderJourney.js"),
            "./renderAboutBuilder.js": absUrl("../js/pages/profile/renderAboutBuilder.js"),
            "./resolveFeaturedBuild.js": absUrl("../js/pages/profile/resolveFeaturedBuild.js"),
            "../../utils/icons.js": absUrl("../js/utils/icons.js"),
            "../../components/ManageRolesControl.js": manageRolesControlMockUrl
        });

        const { renderProfile, renderProfileError } = await import(renderProfileUrl);

        function resetDom() {
            document.getElementById("profileAvatar").innerHTML = "?";
            document.getElementById("profileUsername").textContent = "Loading...";
            document.getElementById("profileDisplayName").textContent = "";
            document.getElementById("profileDisplayName").hidden = true;
            document.getElementById("profileHeadline").textContent = "";
            document.getElementById("profileHeadline").hidden = true;
            document.getElementById("profileMeta").innerHTML = "";
            document.getElementById("profileLinks").innerHTML = "";
            document.getElementById("profileFollowCounts").innerHTML = "";
            document.getElementById("followBtn").hidden = true;
            document.getElementById("profileStats").innerHTML = "";
            document.getElementById("profileTechFocus").innerHTML = "";
            document.getElementById("profileTechFocus").hidden = true;
            document.getElementById("profileEmptyState").hidden = true;
            document.getElementById("profileFeatured").innerHTML = "";
            document.getElementById("profileFeatured").hidden = true;
            document.getElementById("profileGallery").hidden = true;
            document.getElementById("profileGalleryFilters").innerHTML = "";
            document.getElementById("profileBuilds").innerHTML = "";
            document.getElementById("profileTechBreakdown").innerHTML = "";
            document.getElementById("profileTechBreakdown").hidden = true;
            document.getElementById("profileJourney").innerHTML = "";
            document.getElementById("profileJourney").hidden = true;
            document.getElementById("profileAbout").innerHTML = "";
            document.getElementById("profileAbout").hidden = true;
        }

        function makeBuild(overrides) {
            return {
                id: "b1",
                title: "Build",
                slug: "build",
                category: "pc_build",
                status: "planning",
                visibility: "public",
                views: 0,
                likes_count: 0,
                created_at: "2026-01-01T00:00:00Z",
                updated_at: "2026-01-01T00:00:00Z",
                ...overrides
            };
        }

        // --- Case 1: full profile, no explicit pin, one completed build ----
        resetDom();
        mockAvatarUrl = "https://signed.example/avatars%2Fuser-a%2F500.jpg";

        const fullProfile = {
            id: "user-a",
            username: "alice",
            display_name: "Alice Builder",
            headline: "Hardware engineer building open silicon",
            bio: "I build robots.",
            location: "Toronto, ON",
            website: "alice.dev",
            github: "@alice",
            youtube: "",
            avatar_path: "avatars/user-a/500.jpg",
            avatar_url: null,
            created_at: "2024-03-15T00:00:00Z",
            featured_build_id: null
        };

        const fullBuilds = [
            makeBuild({ id: "b1", title: "Robot Arm", slug: "robot-arm", category: "robotics", status: "completed", views: 120, updated_at: "2026-06-01T00:00:00Z", profiles: fullProfile }),
            makeBuild({ id: "b2", title: "Desk Setup", slug: "desk-setup", category: "setup", status: "planning", views: 33, updated_at: "2026-01-01T00:00:00Z", profiles: fullProfile })
        ];

        await renderProfile({ profile: fullProfile, builds: fullBuilds, commentCount: 7, currentUser: null, journeyEvents: [] });

        test("username is rendered", document.getElementById("profileUsername").textContent === "alice");
        test("display_name is shown when different from username", document.getElementById("profileDisplayName").hidden === false && document.getElementById("profileDisplayName").textContent === "Alice Builder");
        test("headline is rendered in the Hero (not bio)", document.getElementById("profileHeadline").textContent === "Hardware engineer building open silicon");
        test("avatar resolves avatar_path to a signed image", document.getElementById("profileAvatar").querySelector("img")?.getAttribute("src") === mockAvatarUrl);

        const statsText = document.getElementById("profileStats").textContent;
        test("Overview stats show the project count", statsText.includes("2") && statsText.includes("Projects"));
        test("Overview stats show the comment count param", statsText.includes("7") && statsText.includes("Comments Received"));

        test("Featured Project renders the most recently updated COMPLETED build (Robot Arm), no explicit pin", document.getElementById("profileFeatured").hidden === false && document.getElementById("profileFeatured").textContent.includes("Robot Arm"));
        test("Project Gallery excludes the build shown as Featured", !document.getElementById("profileBuilds").textContent.includes("Robot Arm") && document.getElementById("profileBuilds").textContent.includes("Desk Setup"));
        test("Technology Breakdown is visible with 2 public builds across 2 categories", document.getElementById("profileTechBreakdown").hidden === false);
        test("About Builder shows the bio text", document.getElementById("profileAbout").textContent.includes("I build robots."));

        // --- Case 2: explicit featured_build_id pin wins over the fallback chain ---
        resetDom();
        mockAvatarUrl = "";

        const pinnedProfile = { ...fullProfile, featured_build_id: "b2" };
        await renderProfile({ profile: pinnedProfile, builds: fullBuilds, commentCount: 0, currentUser: null, journeyEvents: [] });

        test("an explicit pin (Desk Setup) wins over a more-recently-updated completed build", document.getElementById("profileFeatured").textContent.includes("Desk Setup") && !document.getElementById("profileFeatured").textContent.includes("Robot Arm"));

        // --- Case 3: zero builds, viewer IS the owner -> empty-state CTA ----
        resetDom();
        mockAvatarUrl = "";

        const minimalProfile = {
            id: "user-b",
            username: "bob",
            display_name: null,
            headline: null,
            bio: null,
            location: null,
            website: null,
            github: null,
            youtube: null,
            avatar_path: null,
            avatar_url: null,
            created_at: "2025-11-02T00:00:00Z",
            featured_build_id: null
        };

        await renderProfile({ profile: minimalProfile, builds: [], commentCount: 0, currentUser: { id: "user-b" }, journeyEvents: [] });

        test("display_name is hidden when absent", document.getElementById("profileDisplayName").hidden === true);
        test("headline is hidden when absent", document.getElementById("profileHeadline").hidden === true);
        test("zero-project empty state IS shown to the owner, with the Publish CTA", document.getElementById("profileEmptyState").hidden === false && document.getElementById("profileEmptyState").innerHTML.includes("Publish Your First Build"));
        test("Featured Project is omitted (not empty-rendered) with zero builds", document.getElementById("profileFeatured").hidden === true);
        test("Project Gallery is omitted with zero builds", document.getElementById("profileGallery").hidden === true);
        test("Technology Breakdown is omitted with zero builds", document.getElementById("profileTechBreakdown").hidden === true);
        test("About Builder still renders for the owner even with an empty bio (shows the Settings prompt)", document.getElementById("profileAbout").hidden === false && document.getElementById("profileAbout").textContent.includes("Add a bio"));

        // --- Case 4: zero builds, viewer is NOT the owner -> fully quiet ----
        resetDom();
        mockAvatarUrl = "";

        await renderProfile({ profile: minimalProfile, builds: [], commentCount: 0, currentUser: null, journeyEvents: [] });

        test("zero-project empty state is NOT shown to a non-owner visitor", document.getElementById("profileEmptyState").hidden === true);
        test("About Builder is omitted entirely for a non-owner when the bio is empty", document.getElementById("profileAbout").hidden === true);

        // --- Case 5: Builder Journey renders the events it's given -----------
        resetDom();
        mockAvatarUrl = "";

        const journeyEvents = [
            { type: "milestone", date: "2026-06-01T00:00:00Z", build: { slug: "robot-arm" }, label: "Cooling loop redone" }
        ];

        await renderProfile({ profile: fullProfile, builds: fullBuilds, commentCount: 0, currentUser: null, journeyEvents });

        test("Builder Journey renders a passed-in event", document.getElementById("profileJourney").hidden === false && document.getElementById("profileJourney").textContent.includes("Cooling loop redone"));

        // --- Case 6: error state ---------------------------------------------
        resetDom();
        document.getElementById("profileUsername").textContent = "Loading...";

        renderProfileError();

        test("error state replaces the loading username with a visible message", document.getElementById("profileUsername").textContent !== "Loading..." && document.getElementById("profileUsername").textContent.length > 0);
        test("error state shows a visible explanation in the Headline slot", document.getElementById("profileHeadline").hidden === false && document.getElementById("profileHeadline").textContent.toLowerCase().includes("could not be loaded"));
        test("error state hides every conditional section", ["profileEmptyState", "profileFeatured", "profileGallery", "profileTechBreakdown", "profileJourney", "profileAbout"].every(id => document.getElementById(id).hidden === true));

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`profile.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
