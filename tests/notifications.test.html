<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 7B — notifications page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 7B — notifications page</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <button type="button" id="notificationsMarkAllRead">Mark all read</button>
    <div id="notificationsList"></div>
    <button type="button" id="notificationsLoadMore" hidden>Load More</button>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        // --- Mock state -----------------------------------------------------
        const calls = [];
        const toastMessages = [];
        let pages = []; // queue of arrays returned by successive getNotificationsPage calls
        let pageError = null;
        let markAllShouldFail = false;
        let markOneShouldFail = false;

        globalThis.__mock = {
            calls,
            toastMessages,
            get pages() { return pages; },
            get pageError() { return pageError; },
            get markAllShouldFail() { return markAllShouldFail; },
            get markOneShouldFail() { return markOneShouldFail; }
        };

        const toastSrc = `
            export function showToast(message, type) {
                globalThis.__mock.toastMessages.push({ message, type });
            }
        `;

        const notificationRepoSrc = `
            export async function getNotificationsPage(args) {
                globalThis.__mock.calls.push(["getNotificationsPage", args]);
                if (globalThis.__mock.pageError) throw new Error(globalThis.__mock.pageError);
                return globalThis.__mock.pages.shift() || [];
            }
            export async function markNotificationRead(id) {
                globalThis.__mock.calls.push(["markNotificationRead", id]);
                if (globalThis.__mock.markOneShouldFail) throw new Error("could not mark read");
            }
            export async function markAllNotificationsRead() {
                globalThis.__mock.calls.push(["markAllNotificationsRead"]);
                if (globalThis.__mock.markAllShouldFail) throw new Error("could not mark all read");
            }
            export async function enrichNotifications(notifications) {
                globalThis.__mock.calls.push(["enrichNotifications", notifications.length]);
                return notifications;
            }
        `;

        const formatUrl = new URL("../js/utils/notificationFormat.js", location.href).href;

        const rewrites = {
            '"../../repositories/notificationRepository.js"': blobUrl(notificationRepoSrc),
            '"../../utils/notificationFormat.js"': formatUrl,
            // Milestone 8B: renderNotifications.js gained this import (a
            // missing error toast on Mark all read failure).
            '"../../core/toast.js"': blobUrl(toastSrc)
        };

        const realSrc = await (await fetch("../js/pages/notifications/renderNotifications.js")).text();
        let rewritten = realSrc;
        for (const [from, to] of Object.entries(rewrites)) {
            rewritten = rewritten.replaceAll(from, `"${to}"`);
        }

        const { renderNotifications } = await import(blobUrl(rewritten));

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        // Real <a href> rows would actually navigate this test page away on
        // a synthetic click — same lesson as notificationBell.test.html.
        // This helper cancels the default action before dispatching.
        function safeClick(el) {
            el.addEventListener("click", event => event.preventDefault(), { capture: true, once: true });
            el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        }

        function makeNotification(id, overrides = {}) {
            return {
                id,
                recipient_id: "user-me",
                actor_id: "user-a",
                type: "like",
                build_id: "build-1",
                comment_id: null,
                read_at: null,
                created_at: new Date(Date.now() - Number(id.replace(/\D/g, "") || 0) * 1000).toISOString(),
                actor: { id: "user-a", username: "alice" },
                build: { id: "build-1", slug: "cool-build", title: "Cool Build" },
                ...overrides
            };
        }

        const listEl = document.getElementById("notificationsList");
        const loadMoreBtn = document.getElementById("notificationsLoadMore");
        const markAllBtn = document.getElementById("notificationsMarkAllRead");

        // --- Case 1: a full page (20) implies more pages exist ---------------
        const fullPage = Array.from({ length: 20 }, (_, i) => makeNotification(`n${i}`));
        pages = [fullPage];
        calls.length = 0;

        await renderNotifications();

        test("renders one row per notification", document.querySelectorAll(".notification-row").length === 20);
        test("a full page shows the Load More button", loadMoreBtn.hidden === false);
        test("fetches with the expected page size and no cursor on first load", calls.some(c => c[0] === "getNotificationsPage" && c[1].limit === 20 && c[1].before === undefined));

        // --- Case 2: Load More appends a second (partial) page ---------------
        const secondPage = [makeNotification("m0"), makeNotification("m1")];
        pages = [secondPage];
        calls.length = 0;

        loadMoreBtn.click(); // a real <button>, not a link — safe to click directly
        await waitFor(() => calls.some(c => c[0] === "getNotificationsPage"));
        await waitFor(() => document.querySelectorAll(".notification-row").length === 22);

        test("Load More appends the next page to the existing rows", document.querySelectorAll(".notification-row").length === 22);
        test("a partial page (< page size) hides Load More", loadMoreBtn.hidden === true);
        test("the second page request uses the last loaded row's created_at as the cursor", calls.some(c => c[0] === "getNotificationsPage" && typeof c[1].before === "string"));

        // --- Case 3: clicking an unread row marks it read, in the background ---
        calls.length = 0;
        const unreadRow = document.querySelector('.notification-row[data-id="n0"]');
        test("row starts unread", unreadRow.classList.contains("is-unread"));

        safeClick(unreadRow);
        await waitFor(() => calls.some(c => c[0] === "markNotificationRead"));

        test("clicking an unread row calls markNotificationRead with its id", calls.some(c => c[0] === "markNotificationRead" && c[1] === "n0"));
        test("the row loses is-unread immediately on click", !unreadRow.classList.contains("is-unread"));

        // --- Case 4: clicking an already-read row does not call markNotificationRead again ---
        calls.length = 0;
        safeClick(unreadRow); // same row, now already read
        await new Promise(r => setTimeout(r, 50));

        test("clicking an already-read row does not call markNotificationRead again", !calls.some(c => c[0] === "markNotificationRead"));

        // --- Case 5: Mark all read clears every unread row --------------------
        calls.length = 0;
        markAllBtn.click();

        await waitFor(() => calls.some(c => c[0] === "markAllNotificationsRead"));
        await new Promise(r => setTimeout(r, 20));

        test("Mark all read calls markAllNotificationsRead", calls.some(c => c[0] === "markAllNotificationsRead"));
        test("Mark all read clears is-unread from every row", document.querySelectorAll(".notification-row.is-unread").length === 0);

        // --- Case 5b: a failed Mark all read surfaces an error toast (Milestone 8B) ---
        calls.length = 0;
        toastMessages.length = 0;
        markAllShouldFail = true;
        markAllBtn.click();

        await waitFor(() => toastMessages.length > 0);

        test("a failed Mark all read surfaces an error toast (previously silent)", toastMessages.some(t => t.type === "error" && t.message.includes("could not mark all read")), JSON.stringify(toastMessages));
        test("a failed Mark all read still re-enables the button", markAllBtn.disabled === false);

        markAllShouldFail = false;

        // --- Case 6: empty state -----------------------------------------
        pages = [[]];
        calls.length = 0;

        await renderNotifications();

        test("zero notifications shows an empty-state message", document.getElementById("notificationsList").textContent.includes("No notifications yet"));
        test("empty state hides Load More", loadMoreBtn.hidden === true);

        // --- Case 7: initial load failure shows a visible error, not a blank/stuck list ---
        pageError = "network down";
        calls.length = 0;

        await renderNotifications();

        test("a load failure shows a visible error message", document.getElementById("notificationsList").textContent.toLowerCase().includes("could not load"));

        pageError = null;

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`notifications.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
