<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 8D — listState (aria-live + retry focus)</title>
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 8D — listState (aria-live + retry focus)</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <div id="container1"></div>
    <div id="container2"></div>
    <div id="container3"></div>
    <div id="container4"></div>
    <input id="externalFocusTarget" type="text">

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        // listState.js has no imports of its own — real file used directly, no mocking needed.
        const { renderLoadingState, renderEmptyState, renderErrorState } = await import("../js/utils/listState.js");

        // --- Case 1: renderLoadingState/renderEmptyState set role+aria-live ---
        const c1 = document.getElementById("container1");
        renderLoadingState(c1, "Loading widgets...");
        test("renderLoadingState sets role=status", c1.getAttribute("role") === "status");
        test("renderLoadingState sets aria-live=polite", c1.getAttribute("aria-live") === "polite");
        test("renderLoadingState renders the given message", c1.textContent.includes("Loading widgets..."));

        renderEmptyState(c1, { title: "No widgets yet.", description: "Add one to get started." });
        test("renderEmptyState sets role=status", c1.getAttribute("role") === "status");
        test("renderEmptyState sets aria-live=polite", c1.getAttribute("aria-live") === "polite");
        test("renderEmptyState renders title + description", c1.textContent.includes("No widgets yet.") && c1.textContent.includes("Add one to get started."));

        // --- Case 2: renderErrorState base markup + aria-live ---
        const c2 = document.getElementById("container2");
        renderErrorState(c2, { message: "Could not load widgets." });
        test("renderErrorState sets role=status", c2.getAttribute("role") === "status");
        test("renderErrorState sets aria-live=polite", c2.getAttribute("aria-live") === "polite");
        test("renderErrorState renders the message as a heading", c2.querySelector("h3")?.textContent === "Could not load widgets.");
        test("renderErrorState with no onRetry renders no retry button", c2.querySelector(".list-state-retry") === null);
        test("the error heading is focusable via tabindex=-1 (for the repeated-failure path)", c2.querySelector("h3")?.getAttribute("tabindex") === "-1");

        // --- Case 3: successful retry — generic fallback focuses the first
        //     focusable element rendered back into the same container ---
        const c3 = document.getElementById("container3");
        let attempt = 0;

        function loadIntoC3() {
            attempt++;
            if (attempt === 1) {
                renderErrorState(c3, {
                    message: "Could not load items.",
                    onRetry: () => loadIntoC3()
                });
                return Promise.resolve();
            }
            // "Success": real content lands back in the SAME container,
            // containing a focusable link — matches Dashboard/Workshop/Build's
            // actual retry pattern.
            c3.innerHTML = `<a href="#" id="c3Link">First real item</a><a href="#">Second item</a>`;
            return Promise.resolve();
        }

        await loadIntoC3();
        test("initial failure renders the retry button", c3.querySelector(".list-state-retry") !== null);

        c3.querySelector(".list-state-retry").click();
        await waitFor(() => document.activeElement?.id === "c3Link");

        test("a successful retry (generic fallback) moves focus to the first focusable element in the container", document.activeElement?.id === "c3Link");

        // --- Case 4: successful retry — caller-supplied retryFocusTarget wins
        //     over the generic in-container fallback (Settings' actual case:
        //     real content lands in static fields elsewhere on the page) ---
        const c4 = document.getElementById("container4");
        let attempt4 = 0;

        function loadIntoC4() {
            attempt4++;
            if (attempt4 === 1) {
                renderErrorState(c4, {
                    message: "Could not load profile.",
                    onRetry: () => loadIntoC4(),
                    retryFocusTarget: () => document.getElementById("externalFocusTarget")
                });
                return Promise.resolve();
            }
            // "Success": c4 itself is cleared/hidden (like Settings' errorContainer),
            // the real content is a static field elsewhere on the page.
            c4.innerHTML = "";
            return Promise.resolve();
        }

        await loadIntoC4();
        c4.querySelector(".list-state-retry").click();
        await waitFor(() => document.activeElement?.id === "externalFocusTarget");

        test("a successful retry honors a caller-supplied retryFocusTarget over the generic fallback", document.activeElement?.id === "externalFocusTarget");

        // --- Case 5: retry fails again — focus moves to the fresh error heading ---
        const c5 = document.getElementById("container1"); // reuse container1, already clean of prior state
        c5.innerHTML = "";
        let shouldFailAgain = true;

        function loadIntoC5() {
            renderErrorState(c5, {
                message: shouldFailAgain ? "Still could not load." : "unreachable",
                onRetry: () => loadIntoC5()
            });
            return Promise.resolve();
        }

        loadIntoC5();
        const firstHeading = c5.querySelector("h3");

        c5.querySelector(".list-state-retry").click();
        await waitFor(() => document.activeElement?.tagName === "H3" && document.activeElement !== firstHeading);

        test("a repeated failure moves focus to the fresh error heading", document.activeElement === c5.querySelector(".list-state-error h3"));
        test("the fresh error heading still shows the message", c5.querySelector("h3")?.textContent === "Still could not load.");

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`listState.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
