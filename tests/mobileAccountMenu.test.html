<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production stabilization — mobile account menu</title>
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Production stabilization — mobile account menu</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <div id="navbar"></div>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        function waitFor(predicate, timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        // --- Mocks for loadNavbar()'s dependencies -------------------------
        // supabase/auth/notificationBell/onboarding all touch the network or
        // a real session — mocked. escapeHtml.js and icons.js have no
        // imports of their own, so the real files are used as-is (same
        // convention as tests/componentAutocomplete.test.html).
        const supabaseMockSrc = `
            export const supabase = {
                auth: { signOut: async () => ({ error: null }) },
                from() {
                    return {
                        select() {
                            return {
                                eq() {
                                    return { single: async () => ({ data: { username: "tester", onboarding_welcomed_at: "2026-01-01T00:00:00Z" } }) };
                                }
                            };
                        }
                    };
                }
            };
        `;
        const authMockSrc = `
            export function getCurrentUser() { return Promise.resolve({ id: "u1" }); }
            export function clearCurrentUserCache() {}
        `;
        const notificationBellMockSrc = `export async function initNotificationBell() {}`;
        const onboardingMockSrc = `export function maybeShowWelcome() {}`;

        const escapeHtmlUrl = new URL("../js/utils/escapeHtml.js", location.href).href;
        const iconsUrl = new URL("../js/utils/icons.js", location.href).href;

        const rewrites = {
            '"./supabase.js"': blobUrl(supabaseMockSrc),
            '"./auth.js"': blobUrl(authMockSrc),
            '"./notificationBell.js"': blobUrl(notificationBellMockSrc),
            '"./onboarding.js"': blobUrl(onboardingMockSrc),
            '"../utils/escapeHtml.js"': escapeHtmlUrl,
            '"../utils/icons.js"': iconsUrl
        };

        const realSrc = await (await fetch("../js/core/layout.js")).text();
        let rewritten = realSrc;
        for (const [from, to] of Object.entries(rewrites)) {
            rewritten = rewritten.replaceAll(from, `"${to}"`);
        }

        const { loadNavbar } = await import(blobUrl(rewritten));

        await loadNavbar("");
        await waitFor(() => document.getElementById("navToggle") !== null);

        const navToggle = document.getElementById("navToggle");
        const navLinks = document.getElementById("navLinks");
        const builderButton = document.getElementById("builderMenuButton");
        const builderDropdown = document.getElementById("builderDropdown");

        // --- Case 1: hamburger open/close, aria-expanded stays in sync ------
        // Runs at this document's default (desktop-sized) viewport.
        navToggle.click();
        test("tapping the hamburger opens nav-links", navLinks.classList.contains("show-nav-links"));
        test("navToggle aria-expanded syncs to true when open", navToggle.getAttribute("aria-expanded") === "true");

        navToggle.click();
        test("tapping the hamburger again closes nav-links", !navLinks.classList.contains("show-nav-links"));
        test("navToggle aria-expanded syncs back to false", navToggle.getAttribute("aria-expanded") === "false");

        // --- Case 2: the desktop account button still opens its dropdown —
        // desktop navigation is unchanged by this pass. ----------------------
        builderButton.click();
        test("(desktop) tapping the account button opens the builder dropdown", builderDropdown.classList.contains("show-dropdown"));
        test("(desktop) builderButton aria-expanded syncs to true when open", builderButton.getAttribute("aria-expanded") === "true");

        const dropdownLinks = [...builderDropdown.querySelectorAll("a")];
        const desktopProfileLink = dropdownLinks.find(a => a.textContent.trim() === "View My Profile");
        const desktopSettingsLink = dropdownLinks.find(a => a.textContent.trim() === "Settings");

        test("(desktop) a 'View My Profile' link exists inside the open dropdown", Boolean(desktopProfileLink));
        test("(desktop) a 'Settings' link exists inside the open dropdown", Boolean(desktopSettingsLink));

        builderButton.click();
        test("(desktop) tapping the account button again closes the dropdown", !builderDropdown.classList.contains("show-dropdown"));

        builderButton.click();
        document.body.click();
        test("(desktop) clicking outside the dropdown closes it", !builderDropdown.classList.contains("show-dropdown"));

        builderButton.click();
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
        test("(desktop) Escape closes the open dropdown", !builderDropdown.classList.contains("show-dropdown"));
        test("(desktop) Escape returns focus to the account button", document.activeElement === builderButton);

        navToggle.click();
        test("nav-links reopens via the hamburger", navLinks.classList.contains("show-nav-links"));
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
        test("Escape also closes nav-links", !navLinks.classList.contains("show-nav-links"));

        // --- Case 3: three mobile-only account links exist in the DOM
        // alongside the desktop dropdown (same loadNavbar() output, both
        // markups present at once — CSS picks one per viewport). At this
        // document's default (desktop) width they must stay hidden, so
        // nothing doubles up above the 700px breakpoint. -------------------
        // This outer test document never links navbar.css itself (only
        // the iframes below do), so only DOM existence is meaningful to
        // check here — the actual show/hide-per-viewport behavior is
        // verified against real loaded CSS in Cases 4 and 5.
        const mobileLinksAtDesktopWidth = [...document.querySelectorAll(".mobile-account-link")];
        test("three .mobile-account-link elements exist in the DOM regardless of viewport", mobileLinksAtDesktopWidth.length === 3);

        // --- Case 4 — the actual production bug: reproduced against the
        // REAL loadNavbar() (not static test markup), with realistic async
        // auth/profile/notification-bell timing (none of these resolve
        // synchronously in production), rendered inside a same-origin
        // iframe sized to a real mobile-Safari viewport so navbar.css's
        // @media (max-width: 700px) rules genuinely apply. This is a
        // fully separate render — its own fetch of layout.js, its own
        // mocks, its own DOM — run entirely inside the iframe's own
        // document/window so `document.getElementById(...)` etc. inside
        // loadNavbar() resolve against the iframe, not this outer page. ---
        const iframe = document.createElement("iframe");
        iframe.style.width = "390px";
        iframe.style.height = "844px";
        iframe.style.border = "1px solid #333";
        document.body.appendChild(iframe);

        const layoutUrl = new URL("../js/core/layout.js", location.href).href;
        const escapeHtmlUrl2 = new URL("../js/utils/escapeHtml.js", location.href).href;
        const iconsUrl2 = new URL("../js/utils/icons.js", location.href).href;
        const tokensUrl = new URL("../css/base/tokens.css", location.href).href;
        const resetUrl = new URL("../css/base/reset.css", location.href).href;
        const navbarCssUrl = new URL("../css/layout/navbar.css", location.href).href;
        const dropdownCssUrl = new URL("../css/components/dropdown.css", location.href).href;

        const delayedSupabaseMockSrc = `
            export const supabase = {
                auth: { signOut: async () => { window.__signOutCalled = true; return { error: null }; } },
                from() {
                    return {
                        select() {
                            return {
                                eq() {
                                    return {
                                        single: async () => {
                                            await new Promise(r => setTimeout(r, 120));
                                            return { data: { username: "A Reasonably Long Real Username", onboarding_welcomed_at: "2026-01-01T00:00:00Z" } };
                                        }
                                    };
                                }
                            };
                        }
                    };
                }
            };
        `;
        const delayedAuthMockSrc = `
            export async function getCurrentUser() {
                await new Promise(r => setTimeout(r, 80));
                return { id: "u1" };
            }
            export function clearCurrentUserCache() {}
        `;
        const delayedBellMockSrc = `
            export async function initNotificationBell(container) {
                await new Promise(r => setTimeout(r, 60));
                container.innerHTML = '<button aria-label="Notifications">bell</button>';
            }
        `;
        const delayedOnboardingMockSrc = `export function maybeShowWelcome() {}`;

        // Built as a plain string (mock sources embedded via
        // JSON.stringify, not nested template-literal backticks) so it
        // can be assigned to a real <script type="module"> element's
        // textContent and run natively inside the iframe.
        const runnerScriptSrc = `
(async () => {
  try {
    function blobUrl(src) { return URL.createObjectURL(new Blob([src], { type: "text/javascript" })); }
    const supabaseMockSrc = ${JSON.stringify(delayedSupabaseMockSrc)};
    const authMockSrc = ${JSON.stringify(delayedAuthMockSrc)};
    const bellMockSrc = ${JSON.stringify(delayedBellMockSrc)};
    const onboardingMockSrc = ${JSON.stringify(delayedOnboardingMockSrc)};
    const rewrites = {
        '"./supabase.js"': blobUrl(supabaseMockSrc),
        '"./auth.js"': blobUrl(authMockSrc),
        '"./notificationBell.js"': blobUrl(bellMockSrc),
        '"./onboarding.js"': blobUrl(onboardingMockSrc),
        '"../utils/escapeHtml.js"': ${JSON.stringify(escapeHtmlUrl2)},
        '"../utils/icons.js"': ${JSON.stringify(iconsUrl2)}
    };
    const realSrc = await (await fetch(${JSON.stringify(layoutUrl)})).text();
    let rewritten = realSrc;
    for (const [from, to] of Object.entries(rewrites)) rewritten = rewritten.replaceAll(from, '"' + to + '"');

    const mod = await import(blobUrl(rewritten));
    await mod.loadNavbar("");

    // The one and only tap this now takes: open the hamburger. No second
    // control needed to reach Profile/Settings/Log Out on mobile.
    const navToggle = document.getElementById("navToggle");
    navToggle.click();

    const navLinks = document.getElementById("navLinks");
    const mobileLinks = [...document.querySelectorAll(".mobile-account-link")];
    const profileLink = mobileLinks.find(a => a.textContent.trim() === "View My Profile");
    const settingsLink = mobileLinks.find(a => a.textContent.trim() === "Settings");
    const logoutLink = mobileLinks.find(a => a.textContent.trim() === "Log Out");
    const builderMenu = document.querySelector(".builder-menu");

    function box(el) {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return { top: r.top, bottom: r.bottom, height: r.height, display: cs.display, visibility: cs.visibility };
    }

    const navLinksBox = navLinks.getBoundingClientRect();

    // logoutLink's real click handler (attached by the real loadNavbar()
    // itself) calls supabase.auth.signOut() then sets
    // window.location.href — a genuine navigation, which would tear down
    // this very script before it could report anything if we waited
    // (via setTimeout/microtask) past it. The mock signOut() sets
    // window.__signOutCalled synchronously as the first thing it does,
    // and .click() runs the listener synchronously up to its first
    // await — so the flag is already set by the time .click() returns,
    // one full task before the pending navigation microtask actually
    // fires. Everything is therefore read and reported in this same
    // synchronous turn, deliberately with no await/setTimeout in
    // between, so the report always wins the race against the real
    // navigation it's confirming happened.
    logoutLink?.click();

    window.parent.__mobileAccountTestResult = {
        mobileLinksCount: mobileLinks.length,
        profileLinkFound: Boolean(profileLink),
        settingsLinkFound: Boolean(settingsLink),
        logoutLinkFound: Boolean(logoutLink),
        profileHref: profileLink ? profileLink.getAttribute("href") : null,
        settingsHref: settingsLink ? settingsLink.getAttribute("href") : null,
        profileBox: box(profileLink),
        settingsBox: box(settingsLink),
        builderMenuDisplay: builderMenu ? getComputedStyle(builderMenu).display : null,
        navLinksBottom: navLinksBox.bottom,
        navLinksTop: navLinksBox.top,
        innerHeight: window.innerHeight,
        signOutCalledFromMobileLink: window.__signOutCalled === true
    };
  } catch (err) {
    window.parent.__mobileAccountTestResult = { error: String(err && err.stack || err) };
  }
})();
        `;

        const idoc = iframe.contentDocument;
        idoc.open();
        idoc.write(`<!DOCTYPE html><html><head>
            <link rel='stylesheet' href='${tokensUrl}'>
            <link rel='stylesheet' href='${resetUrl}'>
            <link rel='stylesheet' href='${navbarCssUrl}'>
            <link rel='stylesheet' href='${dropdownCssUrl}'>
        </head><body><div id="navbar"></div></body></html>`);
        idoc.close();

        // A real <script type="module"> element, appended after parsing —
        // this is the one reliable way to get executable module code
        // running with the iframe's own document/window as its globals
        // (a script string embedded via document.write's HTML text is
        // inert; it never runs).
        const scriptEl = idoc.createElement("script");
        scriptEl.type = "module";
        scriptEl.textContent = runnerScriptSrc;
        idoc.body.appendChild(scriptEl);

        await waitFor(() => window.__mobileAccountTestResult !== undefined && window.__mobileAccountTestResult !== null);
        const r = window.__mobileAccountTestResult;

        test(
            "the real loadNavbar() (real async timing, real DOM, not static test markup) renders exactly 3 mobile-account-link elements",
            r.mobileLinksCount === 3,
            JSON.stringify(r)
        );
        test("View My Profile is rendered by the real render path", r.profileLinkFound);
        test("Settings is rendered by the real render path", r.settingsLinkFound);
        test("Log Out is rendered by the real render path", r.logoutLinkFound);
        test("the Profile mobile link has a real href, not disabled/inert", Boolean(r.profileHref));
        test("the Settings mobile link has a real href, not disabled/inert", Boolean(r.settingsHref));
        test(
            "the desktop .builder-menu (button + nested dropdown) is not displayed at this mobile viewport — no second control exists to find",
            r.builderMenuDisplay === "none"
        );
        test(
            "Profile has a real rendered box (not display:none, not zero height) inside the open menu",
            r.profileBox && r.profileBox.display !== "none" && r.profileBox.height > 0
        );
        test(
            "Settings has a real rendered box (not display:none, not zero height) inside the open menu",
            r.settingsBox && r.settingsBox.display !== "none" && r.settingsBox.height > 0
        );
        test(
            "Profile is within nav-links' own scrollable bottom edge, not clipped by it",
            r.profileBox && r.profileBox.bottom <= r.navLinksBottom
        );
        test(
            "Settings is within nav-links' own scrollable bottom edge, not clipped by it",
            r.settingsBox && r.settingsBox.bottom <= r.navLinksBottom
        );
        test(
            "Profile is within the actual visible mobile viewport (not just its own container's box), so it's really reachable on screen",
            r.profileBox && r.profileBox.bottom <= r.innerHeight
        );
        test(
            "Settings is within the actual visible mobile viewport (not just its own container's box), so it's really reachable on screen",
            r.settingsBox && r.settingsBox.bottom <= r.innerHeight
        );
        test(
            "tapping the mobile Log Out link fires the same sign-out flow as the desktop one",
            r.signOutCalledFromMobileLink === true
        );

        document.body.removeChild(iframe);

        // --- Case 5: the inverse of Case 4, at a desktop width, with real
        // navbar.css/dropdown.css loaded (unlike the outer document) — the
        // three mobile-only links must stay hidden and .builder-menu must
        // still be the visible, functional route to Profile/Settings/
        // Log Out above the 700px breakpoint. Static markup is enough
        // here since this is purely a CSS-cascade check, not a timing one
        // (Cases 1-2 above already cover real desktop JS behavior). -------
        const desktopIframe = document.createElement("iframe");
        desktopIframe.style.width = "1280px";
        desktopIframe.style.height = "300px";
        desktopIframe.style.border = "1px solid #333";
        document.body.appendChild(desktopIframe);

        const ddoc = desktopIframe.contentDocument;
        ddoc.open();
        ddoc.write(`<!DOCTYPE html><html><head>
            <link rel='stylesheet' href='${tokensUrl}'>
            <link rel='stylesheet' href='${resetUrl}'>
            <link rel='stylesheet' href='${navbarCssUrl}'>
            <link rel='stylesheet' href='${dropdownCssUrl}'>
        </head><body><div id="navbar"></div></body></html>`);
        ddoc.close();

        await new Promise(resolve => {
            const links = ddoc.querySelectorAll("link[rel=stylesheet]");
            let loaded = 0;
            links.forEach(link => link.addEventListener("load", () => { loaded++; if (loaded === links.length) resolve(); }));
            setTimeout(resolve, 500);
        });

        const dnavbar = ddoc.getElementById("navbar");
        dnavbar.innerHTML = `
            <div class="navbar-inner">
                <button class="nav-toggle" id="navToggle" aria-expanded="false"></button>
                <div class="nav-links" id="navLinks">
                    <a href='explore.html'>Explore</a>
                    <a href='workshop.html'>Workshop</a>
                    <a href='upload.html'>Publish</a>
                    <div class="builder-menu">
                        <button class="builder-button" id="builderMenuButton">tester</button>
                        <div class="builder-dropdown" id="builderDropdown">
                            <a href='workshop.html'>Workshop</a>
                            <a href='profile.html'>View My Profile</a>
                            <a href='settings.html'>Settings</a>
                            <hr>
                            <a href='#' class="logout-link">Log Out</a>
                        </div>
                    </div>
                    <a href='profile.html' class="mobile-account-link">View My Profile</a>
                    <a href='settings.html' class="mobile-account-link">Settings</a>
                    <a href='#' class="mobile-account-link logout-link">Log Out</a>
                </div>
            </div>
        `;

        const dMobileLinks = [...ddoc.querySelectorAll(".mobile-account-link")];
        const dBuilderMenu = ddoc.querySelector(".builder-menu");
        const dBuilderButton = ddoc.getElementById("builderMenuButton");

        test(
            "at a desktop width, the three mobile-only account links are hidden",
            dMobileLinks.every(a => desktopIframe.contentWindow.getComputedStyle(a).display === "none")
        );
        test(
            "at a desktop width, .builder-menu (the click-to-open account button) is displayed",
            desktopIframe.contentWindow.getComputedStyle(dBuilderMenu).display !== "none"
        );
        test(
            "at a desktop width, the account button itself has a real rendered box",
            dBuilderButton.getBoundingClientRect().height > 0
        );

        document.body.removeChild(desktopIframe);

        // --- Render + report --------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`mobileAccountMenu.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
