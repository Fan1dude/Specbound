<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 6E — save button</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 6E — save button</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <button type="button" id="saveBtn" aria-pressed="false" disabled>Save</button>
    <p id="saveHint" hidden></p>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        // --- Mock state -----------------------------------------------------
        const calls = [];
        const toastMessages = [];
        let mockHasSaved = false;
        let hasSavedShouldFail = false;
        let setSavedShouldFail = false;
        let setSavedErrorMessage = "Could not update your saved projects.";
        let setSavedResultOverride = null;

        globalThis.__mock = {
            calls, toastMessages,
            get mockHasSaved() { return mockHasSaved; },
            get hasSavedShouldFail() { return hasSavedShouldFail; },
            get setSavedShouldFail() { return setSavedShouldFail; },
            get setSavedErrorMessage() { return setSavedErrorMessage; },
            get setSavedResultOverride() { return setSavedResultOverride; }
        };

        const savedRepoSrc = `
            export async function hasSavedBuild(buildId) {
                globalThis.__mock.calls.push(["hasSavedBuild", buildId]);
                if (globalThis.__mock.hasSavedShouldFail) throw new Error("network down");
                return globalThis.__mock.mockHasSaved;
            }
            export async function setBuildSaved(buildId, saved) {
                globalThis.__mock.calls.push(["setBuildSaved", buildId, saved]);
                if (globalThis.__mock.setSavedShouldFail) throw new Error(globalThis.__mock.setSavedErrorMessage);
                const override = globalThis.__mock.setSavedResultOverride;
                if (override !== null) return override;
                return saved;
            }
        `;

        const toastSrc = `
            export function showToast(message, type) {
                globalThis.__mock.toastMessages.push({ message, type });
            }
        `;

        const rewrites = {
            '"../../repositories/savedRepository.js"': blobUrl(savedRepoSrc),
            '"../../core/toast.js"': blobUrl(toastSrc)
        };

        const realSrc = await (await fetch("../js/pages/build/renderSave.js")).text();
        let rewritten = realSrc;
        for (const [from, to] of Object.entries(rewrites)) {
            rewritten = rewritten.replaceAll(from, `"${to}"`);
        }

        const { renderSave } = await import(blobUrl(rewritten));

        const button = document.getElementById("saveBtn");
        const hint = document.getElementById("saveHint");

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        const publicBuild = { id: "build-1", visibility: "public" };
        const privateBuild = { id: "build-2", visibility: "private" };
        const userA = { id: "user-a" };

        // --- Case 1: signed out — disabled, sign-in hint --------------------
        await renderSave(publicBuild, null);

        test("signed out: button is disabled", button.disabled === true);
        test("signed out: a visible sign-in hint is shown", !hint.hidden && hint.textContent.includes("Sign in"));
        test("signed out: no hasSavedBuild call is made", !calls.some(c => c[0] === "hasSavedBuild"));
        test("signed out: button reads 'Save'", button.textContent.trim() === "Save");

        // --- Case 2: signed in, public, not yet saved -----------------------
        calls.length = 0;
        mockHasSaved = false;

        await renderSave(publicBuild, userA);

        test("signed in + public + unsaved: button is enabled", button.disabled === false);
        test("signed in + public + unsaved: hint is hidden", hint.hidden === true);
        test("not-yet-saved: button does not start in the saved state", button.classList.contains("is-saved") === false);
        test("initial save status is checked for the signed-in user", calls.some(c => c[0] === "hasSavedBuild" && c[1] === "build-1"));

        // --- Case 3: click to save — optimistic, then reconciled ------------
        calls.length = 0;
        button.click();

        test("optimistic update: button shows saved immediately on click", button.classList.contains("is-saved") === true);
        test("optimistic update: button text updates immediately", button.textContent.trim() === "Saved");
        test("optimistic update: button is disabled while the request is in flight", button.disabled === true);

        await waitFor(() => calls.some(c => c[0] === "setBuildSaved"));
        await waitFor(() => button.disabled === false);

        test("saving calls setBuildSaved(buildId, true)", calls.some(c => c[0] === "setBuildSaved" && c[1] === "build-1" && c[2] === true));
        test("after success, state matches the server's authoritative response", button.classList.contains("is-saved") === true);
        test("a success toast is shown on save", toastMessages.some(t => t.type === "success" && t.message.includes("Saved")));

        // --- Case 4: click again to unsave -----------------------------------
        calls.length = 0;
        toastMessages.length = 0;
        button.click();

        test("optimistic update: button shows unsaved immediately on second click", button.classList.contains("is-saved") === false);

        await waitFor(() => calls.some(c => c[0] === "setBuildSaved"));
        await waitFor(() => button.disabled === false);

        test("unsaving calls setBuildSaved(buildId, false)", calls.some(c => c[0] === "setBuildSaved" && c[1] === "build-1" && c[2] === false));
        test("a success toast is shown on unsave", toastMessages.some(t => t.type === "success" && t.message.includes("Removed")));

        // --- Case 5: failed save request rolls back the optimistic UI --------
        calls.length = 0;
        toastMessages.length = 0;
        setSavedShouldFail = true;
        setSavedErrorMessage = "This project is not available to save.";

        const savedBeforeFailure = button.classList.contains("is-saved");

        button.click();
        await waitFor(() => toastMessages.length > 0);

        test("a failed request rolls back the optimistic saved state", button.classList.contains("is-saved") === savedBeforeFailure);
        test("a failed request surfaces the actual server error via toast", toastMessages.some(t => t.type === "error" && t.message === "This project is not available to save."));
        test("the button is re-enabled after a failed request on a public project", button.disabled === false);

        setSavedShouldFail = false;

        // --- Case 6: signed in, private project, not previously saved --------
        calls.length = 0;
        mockHasSaved = false;

        await renderSave(privateBuild, userA);

        test("signed in + private + unsaved: button is disabled", button.disabled === true);
        test("signed in + private + unsaved: a visible hint explains why", !hint.hidden && hint.textContent.toLowerCase().includes("public"));

        // --- Case 7: signed in, private project, ALREADY saved — unsave still allowed ---
        calls.length = 0;
        mockHasSaved = true;

        await renderSave(privateBuild, userA);

        test("signed in + private + already-saved: button stays enabled (unsave is always allowed)", button.disabled === false);
        test("signed in + private + already-saved: no blocking hint is shown", hint.hidden === true);
        test("signed in + private + already-saved: button starts in the saved state", button.classList.contains("is-saved") === true);

        // Clicking it should unsave successfully even though the build is
        // private — but afterward the button correctly settles back into
        // the disabled "can't newly save a private project" state, so we
        // wait on the call itself, not on disabled becoming false (it
        // never does here).
        calls.length = 0;
        button.click();
        await waitFor(() => calls.some(c => c[0] === "setBuildSaved"));
        await waitFor(() => button.classList.contains("is-saved") === false);

        test("unsaving a private, previously-saved project calls setBuildSaved(buildId, false)", calls.some(c => c[0] === "setBuildSaved" && c[1] === "build-2" && c[2] === false));
        test("after unsaving a private project, the button becomes disabled again (can't re-save while private)", button.disabled === true);

        // --- Case 8: hasSavedBuild failing fails soft ------------------------
        calls.length = 0;
        hasSavedShouldFail = true;

        await renderSave(publicBuild, userA);

        test("a failed initial save-status check does not throw and defaults to unsaved", button.classList.contains("is-saved") === false);
        test("the button is still usable after a failed initial status check", button.disabled === false);

        hasSavedShouldFail = false;

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`save.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
