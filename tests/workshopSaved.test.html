<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milestone 6E — workshop saved projects</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { font-family: ui-monospace, monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; }
        .case { padding: 4px 0; border-bottom: 1px solid #222; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: 700; }
        #summary { margin: 16px 0; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <h1>Milestone 6E — workshop saved projects</h1>
    <div id="results"></div>
    <div id="summary"></div>

    <h1 id="workshopGreeting"></h1>
    <div id="workshopContinue"></div>
    <div id="workshopDraftsSection" hidden><div id="workshopDrafts"></div></div>
    <div id="workshopProjectCount"></div>
    <div id="workshopProjects"></div>
    <div id="workshopSavedCount"></div>
    <div id="workshopSaved"></div>
    <a id="workshopProfileLink"></a>

    <script type="module">
        const results = [];
        function test(name, pass, detail = "") {
            results.push({ name, pass, detail });
        }

        function blobUrl(src) {
            return URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        }

        // --- Mock state -----------------------------------------------------
        const calls = [];
        const toastMessages = [];
        let setSavedShouldFail = false;

        globalThis.__mock = {
            calls, toastMessages,
            get setSavedShouldFail() { return setSavedShouldFail; }
        };

        // BlueprintCard.js has no imports of its own, so the real file is
        // used as-is, same reasoning as profile.test.html.
        const blueprintCardUrl = new URL("../js/components/BlueprintCard.js", location.href).href;

        // DraftCard.js is unused by these test cases but is still imported
        // by the real renderWorkshop.js, so it needs a harmless stand-in.
        const draftCardSrc = `export function DraftCard() { return ""; }`;

        const savedRepoSrc = `
            export async function setBuildSaved(buildId, saved) {
                globalThis.__mock.calls.push(["setBuildSaved", buildId, saved]);
                if (globalThis.__mock.setSavedShouldFail) throw new Error("Could not remove this project.");
                return saved;
            }
        `;

        const toastSrc = `
            export function showToast(message, type) {
                globalThis.__mock.toastMessages.push({ message, type });
            }
        `;

        // escapeHtml.js, progressBar.js, and icons.js have no imports of
        // their own either, so the real files are used as-is.
        const escapeHtmlUrl = new URL("../js/utils/escapeHtml.js", location.href).href;
        const progressBarUrl = new URL("../js/utils/progressBar.js", location.href).href;
        const iconsUrl = new URL("../js/utils/icons.js", location.href).href;

        const rewrites = {
            '"../../components/BlueprintCard.js"': blueprintCardUrl,
            '"../../components/DraftCard.js"': blobUrl(draftCardSrc),
            '"../../repositories/savedRepository.js"': blobUrl(savedRepoSrc),
            '"../../core/toast.js"': blobUrl(toastSrc),
            '"../../utils/escapeHtml.js"': escapeHtmlUrl,
            '"../../utils/progressBar.js"': progressBarUrl,
            '"../../utils/icons.js"': iconsUrl
        };

        const realSrc = await (await fetch("../js/pages/workshop/renderWorkshop.js")).text();
        let rewritten = realSrc;
        for (const [from, to] of Object.entries(rewrites)) {
            rewritten = rewritten.replaceAll(from, `"${to}"`);
        }

        const { renderWorkshop } = await import(blobUrl(rewritten));

        function waitFor(predicate, timeoutMs = 2000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const check = () => {
                    if (predicate()) return resolve();
                    if (Date.now() - start > timeoutMs) return reject(new Error("timed out: " + predicate.toString()));
                    setTimeout(check, 10);
                };
                check();
            });
        }

        const baseArgs = {
            user: { id: "user-me" },
            profile: { username: "me" },
            builds: [],
            revisionCount: 0,
            drafts: [],
            latestBuild: null,
            latestRevision: null
        };

        const savedBuild1 = {
            id: "build-1", title: "Robot Arm", slug: "robot-arm", user_id: "user-a",
            category: "robotics", status: "building", visibility: "public",
            profiles: { id: "user-a", username: "alice" }
        };
        const savedBuild2 = {
            id: "build-2", title: "Desk Setup", slug: "desk-setup", user_id: "user-b",
            category: "setup", status: "completed", visibility: "public",
            profiles: { id: "user-b", username: "bob" }
        };

        // --- Case 1: two saved projects render as real BlueprintCards --------
        renderWorkshop({ ...baseArgs, savedBuilds: [savedBuild1, savedBuild2] });

        const cardsAfterInitialRender = document.querySelectorAll("#workshopSaved .saved-project-card");
        test("one wrapper card renders per saved project", cardsAfterInitialRender.length === 2, `got ${cardsAfterInitialRender.length}`);
        test("each wrapper contains a real BlueprintCard", document.querySelectorAll("#workshopSaved .blueprint-card").length === 2);
        test("cards attribute the correct (other) builder, not 'Unknown Creator'", document.getElementById("workshopSaved").textContent.replace(/\s+/g, " ").includes("By alice") && !document.getElementById("workshopSaved").textContent.includes("Unknown Creator"));
        test("count heading reflects the number of saved projects", document.getElementById("workshopSavedCount").textContent.includes("2"));
        test("each card has a Remove from Saved control", document.querySelectorAll(".saved-remove-btn").length === 2);
        test("BlueprintCard itself is unmodified — no data-build-id leaks onto the card", document.querySelector(".blueprint-card")?.hasAttribute("data-build-id") !== true);

        // --- Case 2: clicking Remove optimistically removes the card ---------
        calls.length = 0;
        const removeBtn1 = document.querySelector('.saved-remove-btn[data-build-id="build-1"]');
        removeBtn1.click();

        test("optimistic removal: the card is gone from the DOM immediately on click", document.querySelectorAll("#workshopSaved .saved-project-card").length === 1);
        test("optimistic removal: the count heading updates immediately", document.getElementById("workshopSavedCount").textContent.includes("1"));

        await waitFor(() => calls.some(c => c[0] === "setBuildSaved"));

        test("removing calls setBuildSaved(buildId, false)", calls.some(c => c[0] === "setBuildSaved" && c[1] === "build-1" && c[2] === false));
        await waitFor(() => toastMessages.some(t => t.type === "success"));
        test("a success toast is shown after removing", toastMessages.some(t => t.type === "success"));

        // --- Case 3: a failed removal rolls back (card reappears) -------------
        calls.length = 0;
        toastMessages.length = 0;
        setSavedShouldFail = true;

        const removeBtn2 = document.querySelector('.saved-remove-btn[data-build-id="build-2"]');
        removeBtn2.click();

        test("optimistic removal still happens immediately even for a request that will fail", document.querySelectorAll("#workshopSaved .saved-project-card").length === 0);

        await waitFor(() => toastMessages.length > 0);

        test("a failed removal restores the card", document.querySelectorAll("#workshopSaved .saved-project-card").length === 1);
        test("a failed removal restores the correct project", document.getElementById("workshopSaved").textContent.replace(/\s+/g, " ").includes("By bob"));
        test("a failed removal restores the count heading", document.getElementById("workshopSavedCount").textContent.includes("1"));
        test("a failed removal surfaces an error toast", toastMessages.some(t => t.type === "error"));

        setSavedShouldFail = false;

        // --- Case 4: removing the last saved project shows the empty state ---
        calls.length = 0;
        toastMessages.length = 0;
        const removeBtnLast = document.querySelector(".saved-remove-btn");
        removeBtnLast.click();

        await waitFor(() => calls.some(c => c[0] === "setBuildSaved"));
        await waitFor(() => toastMessages.some(t => t.type === "success"));

        test("removing the only saved project shows the empty state", document.getElementById("workshopSaved").textContent.includes("haven't saved any projects yet"));
        test("the count heading reflects zero", document.getElementById("workshopSavedCount").textContent.includes("0"));

        // --- Case 5: zero saved projects from the start shows the empty state ---
        renderWorkshop({ ...baseArgs, savedBuilds: [] });

        test("zero saved projects: empty state is shown", document.getElementById("workshopSaved").textContent.includes("haven't saved any projects yet"));
        test("zero saved projects: a link to Explore is offered", document.querySelector("#workshopSaved a[href='explore.html']") !== null);

        // --- Case 6: a failed saved-projects load (null) shows an error, not a false empty state ---
        renderWorkshop({ ...baseArgs, savedBuilds: null });

        test("failed load (null): a visible error message is shown", document.getElementById("workshopSaved").textContent.toLowerCase().includes("could not load"));
        test("failed load (null): this is NOT the same message as a genuine empty state", !document.getElementById("workshopSaved").textContent.includes("haven't saved"));

        // --- Render + report ------------------------------------------------
        const resultsEl = document.getElementById("results");
        resultsEl.innerHTML = results
            .map(r => `<div class="case ${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"} — ${r.name}${r.pass ? "" : ` (${r.detail})`}</div>`)
            .join("");

        const passCount = results.filter(r => r.pass).length;
        const failCount = results.length - passCount;

        document.getElementById("summary").textContent = `${passCount} / ${results.length} passed${failCount ? `, ${failCount} FAILED` : ""}`;
        document.getElementById("summary").className = failCount ? "fail" : "pass";

        window.__testResults = { passCount, failCount, total: results.length, results };
        console.log(`workshopSaved.test.html: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
