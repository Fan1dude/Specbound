<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/logo/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/brand/logo/favicon-48.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#B79AE6">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Specbound</title>
    <link rel="canonical" href="https://specbound.app/pages/updatePassword.html">
    <meta name="robots" content="noindex">

    <meta
        name="description"
        content="Set a new password for your Specbound account."
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Set New Password | Specbound">
    <meta property="og:description" content="Set a new password for your Specbound account.">
    <meta property="og:url" content="https://specbound.app/pages/updatePassword.html">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Set New Password | Specbound">
    <meta name="twitter:description" content="Set a new password for your Specbound account.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<div id="toastContainer" class="toast-container"></div>

<body class="page-foundation">

    <nav class="navbar" id="navbar"></nav>

    <main class="auth-page" id="main">
        <section class="auth-card card card-padding">
            <p class="hero-badge">SPECBOUND</p>
            <h1>Set a new password</h1>

            <p class="auth-subtitle" id="updatePasswordIntro">
                Checking your reset link...
            </p>

            <form id="updatePasswordForm" class="auth-form" hidden>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input id="newPassword" type="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input id="confirmPassword" type="password" placeholder="Re-enter your new password" required autocomplete="new-password" minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" id="updatePasswordSubmit">
                    Set New Password
                </button>
            </form>

            <p class="auth-switch" id="updatePasswordInvalidLink" hidden>
                <a href="forgotPassword.html">Request a new reset link</a>
            </p>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/updatePassword/app.js"></script>
</body>
</html>
