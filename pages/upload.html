<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/logo/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/brand/logo/favicon-48.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#B79AE6">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project | Specbound</title>
    <link rel="canonical" href="https://specboundapp.com/pages/upload.html">

    <meta
        name="description"
        content="Start documenting a new technology build on Specbound."
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Create Project | Specbound">
    <meta property="og:description" content="Start documenting a new technology build on Specbound.">
    <meta property="og:url" content="https://specboundapp.com/pages/upload.html">
    <meta property="og:image" content="https://specboundapp.com/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Create Project | Specbound">
    <meta name="twitter:description" content="Start documenting a new technology build on Specbound.">
    <meta name="twitter:image" content="https://specboundapp.com/assets/brand/og/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-foundation upload-shell">

    <nav class="navbar" id="navbar"></nav>

    <main class="upload-page" id="main">
        <section class="upload-hero">
            <p class="hero-badge">Create Project</p>
            <h1>Start something new</h1>
            <p>
                Give it a name and a technology to begin. You'll fill in
                everything else — specifications, resources, and images — in
                the project editor, and it stays private until you publish it.
            </p>
        </section>

        <section class="upload-shell">
            <form id="createDraftForm" class="upload-form">

                <div class="form-card">
                    <p class="hero-badge">Getting Started</p>
                    <h2>Project Basics</h2>

                    <label for="title">Project Title</label>
                    <input id="title" type="text" placeholder="Project title" required>

                    <fieldset class="upload-technology-fieldset">
                        <legend>Technology</legend>
                        <div class="technology-picker-grid" id="technologyPickerGrid"></div>
                    </fieldset>
                </div>

                <button class="btn btn-primary btn-large" type="submit" id="createDraftSubmit">
                    Continue to Editor
                </button>

            </form>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/upload/app.js"></script>
</body>
</html>
