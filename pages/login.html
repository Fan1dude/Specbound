<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/logo/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/brand/logo/favicon-48.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#B79AE6">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Specbound</title>
    <link rel="canonical" href="https://specbound.app/pages/login.html">
    <meta name="robots" content="noindex">

    <meta
        name="description"
        content="Sign in to your Specbound account."
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Sign In | Specbound">
    <meta property="og:description" content="Sign in to your Specbound account.">
    <meta property="og:url" content="https://specbound.app/pages/login.html">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign In | Specbound">
    <meta name="twitter:description" content="Sign in to your Specbound account.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<div id="toastContainer" class="toast-container"></div>

<body>

    <nav class="navbar" id="navbar"></nav>

    <main class="auth-page" id="main">
        <section class="auth-card card card-padding">
            <p class="hero-badge">SPECBOUND</p>
            <h1>Sign in</h1>

            <p class="auth-subtitle">
                Sign in to upload and manage your projects.
            </p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <p class="auth-forgot">
                    <a href="forgotPassword.html">Forgot password?</a>
                </p>

                <button type="submit" class="btn btn-primary" id="loginSubmit">
                    Sign In
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/login/app.js"></script>
</body>
</html>
