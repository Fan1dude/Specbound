<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#a56bc7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Search projects, builders, and categories on Specbound."
    >

    <title>Search | Specbound</title>
    <link rel="canonical" href="https://specbound.app/pages/search.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Search | Specbound">
    <meta property="og:description" content="Search projects, builders, and categories on Specbound.">
    <meta property="og:url" content="https://specbound.app/pages/search.html">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Search | Specbound">
    <meta name="twitter:description" content="Search projects, builders, and categories on Specbound.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <nav class="navbar" id="navbar"></nav>

    <main class="search-page" id="main">

        <header class="search-header">
            <p class="hero-badge">Search</p>

            <h1 id="searchHeading">Search Specbound.</h1>

            <div class="search-input-wrap">
                <label class="sr-only" for="searchPageInput">
                    Search projects, builders, and categories
                </label>

                <input
                    id="searchPageInput"
                    type="search"
                    placeholder="Search projects, builders, and categories..."
                    autocomplete="off"
                >
            </div>
        </header>

        <section
            id="searchResults"
            class="search-results"
            aria-live="polite"
        ></section>

    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/search/app.js"></script>

</body>
</html>
