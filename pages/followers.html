<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#B79AE6">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers | Specbound</title>

    <meta
        name="description"
        content="See who follows this builder on Specbound."
    >

    <!-- No canonical/og:url: dynamic, per-user page (?user=...) with no
         single static identity. See docs/DEPLOYMENT.md. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Followers | Specbound">
    <meta property="og:description" content="See who follows this builder on Specbound.">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Followers | Specbound">
    <meta name="twitter:description" content="See who follows this builder on Specbound.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="follow-list-page" id="main">
        <section class="follow-list-hero">
            <div>
                <p class="hero-badge">Community</p>
                <h1 id="followListHeading">Followers</h1>
            </div>

            <a href="#" id="followListProfileLink" class="follow-list-back">
                &larr; Back to profile
            </a>
        </section>

        <div id="followListContainer" class="follow-list">
            <p class="text-secondary">Loading...</p>
        </div>

        <div class="follow-list-load-more-wrap">
            <button type="button" id="followListLoadMore" class="btn btn-secondary" hidden>
                Load More
            </button>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/followers/app.js"></script>
</body>
</html>
