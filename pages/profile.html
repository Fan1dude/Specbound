<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#a56bc7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Profile | Specbound</title>

    <meta
        name="description"
        content="View this builder's profile, published projects, and activity on Specbound."
    >

    <!-- No canonical/og:url: dynamic, per-user page (?user=...) with no
         single static identity. See docs/DEPLOYMENT.md. -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Creator Profile | Specbound">
    <meta property="og:description" content="View this builder's profile, published projects, and activity on Specbound.">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Creator Profile | Specbound">
    <meta name="twitter:description" content="View this builder's profile, published projects, and activity on Specbound.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="profile-page" id="main">
        <section class="profile-hero">
            <div class="profile-avatar" id="profileAvatar">?</div>

            <div class="profile-hero-info">
                <p class="hero-badge">Creator</p>
                <h1 id="profileUsername">Loading...</h1>

                <p id="profileDisplayName" class="profile-display-name" hidden></p>
                <p id="profileBio">Hardware Creator</p>

                <div id="profileMeta" class="profile-meta"></div>
                <div id="profileLinks" class="profile-links"></div>

                <div class="profile-follow-row">
                    <div id="profileFollowCounts" class="profile-follow-counts"></div>

                    <div class="follow-action">
                        <button
                            type="button"
                            id="followBtn"
                            class="follow-btn"
                            aria-pressed="false"
                            aria-describedby="followHint"
                            hidden
                        >
                            Follow
                        </button>

                        <p id="followHint" class="follow-hint" role="status" aria-live="polite" hidden></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="profile-stats" id="profileStats">
            <p class="text-secondary">Loading stats...</p>
        </section>

        <section class="profile-section">
            <div class="section-heading">
                <p class="hero-badge">Projects</p>
                <h2>Published Projects</h2>
            </div>

            <div id="profileBuilds" class="project-grid">
                <p class="text-secondary">Loading projects...</p>
            </div>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/profile/app.js"></script>
</body>
</html>
