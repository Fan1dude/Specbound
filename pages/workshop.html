<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/logo/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/brand/logo/favicon-48.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#B79AE6">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workshop | Specbound</title>
    <link rel="canonical" href="https://specbound.app/pages/workshop.html">
    <meta name="robots" content="noindex">

    <meta
        name="description"
        content="Manage your projects, drafts, and activity on Specbound."
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="My Workshop | Specbound">
    <meta property="og:description" content="Manage your projects, drafts, and activity on Specbound.">
    <meta property="og:url" content="https://specbound.app/pages/workshop.html">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Workshop | Specbound">
    <meta name="twitter:description" content="Manage your projects, drafts, and activity on Specbound.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar" id="navbar"></nav>

    <main class="workshop-page" id="main">

        <section class="workshop-hero">
            <p class="hero-badge">MY WORKSHOP</p>
            <h1 id="workshopGreeting">Welcome back.</h1>
            <p class="hero-description">
                Manage your projects, track progress, and continue documenting your work.
            </p>
        </section>

        <section class="workshop-stats" id="workshopStats"></section>

        <h2 class="sr-only">Continue building</h2>

        <section class="workshop-continue" id="workshopContinue">
            <div class="skeleton-card">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        </section>

        <section class="workshop-section" id="workshopDraftsSection" hidden>
            <div class="section-heading">
                <p class="hero-badge">In Progress</p>
                <h2>Drafts</h2>
            </div>

            <div id="workshopDrafts" class="draft-grid"></div>
        </section>

        <section class="workshop-section">
            <div class="section-heading split-heading">
                <div>
                    <p class="hero-badge">My Projects</p>
                    <h2 id="workshopProjectCount">Loading...</h2>
                </div>

                <a href="upload.html" class="btn btn-secondary">
                    New Project
                </a>
            </div>

            <div id="workshopProjects" class="project-grid"></div>
        </section>

        <section class="workshop-section" id="workshopSavedSection">
            <div class="section-heading">
                <p class="hero-badge">Bookmarked</p>
                <h2 id="workshopSavedCount">Saved Projects</h2>
            </div>

            <div id="workshopSaved" class="project-grid"></div>
        </section>

        <section class="workshop-section workshop-actions-section">
            <div class="section-heading">
                <p class="hero-badge">Quick Actions</p>
                <h2>Manage Your Account</h2>
            </div>

            <div class="workshop-actions">
                <a href="upload.html" class="btn btn-secondary">Upload Project</a>
                <a href="settings.html" class="btn btn-secondary">Settings</a>
                <a href="#" id="workshopProfileLink" class="btn btn-secondary">View Public Profile</a>
            </div>
        </section>

    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/workshop/app.js"></script>
</body>
</html>
