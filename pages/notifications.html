<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/brand/logo/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#a56bc7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Specbound</title>
    <link rel="canonical" href="https://specbound.app/pages/notifications.html">
    <meta name="robots" content="noindex">

    <meta
        name="description"
        content="View your Specbound notifications — likes, comments, follows, and updates."
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Specbound">
    <meta property="og:title" content="Notifications | Specbound">
    <meta property="og:description" content="View your Specbound notifications — likes, comments, follows, and updates.">
    <meta property="og:url" content="https://specbound.app/pages/notifications.html">
    <meta property="og:image" content="https://specbound.app/assets/brand/og/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Notifications | Specbound">
    <meta name="twitter:description" content="View your Specbound notifications — likes, comments, follows, and updates.">
    <meta name="twitter:image" content="https://specbound.app/assets/brand/og/og-image.png">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="notifications-page" id="main">
        <section class="notifications-hero">
            <div>
                <p class="hero-badge">Inbox</p>
                <h1>Notifications</h1>
            </div>

            <button type="button" id="notificationsMarkAllRead" class="btn btn-secondary">
                Mark all read
            </button>
        </section>

        <div id="notificationsList" class="notifications-list">
            <p class="text-secondary">Loading notifications...</p>
        </div>

        <div class="notifications-load-more-wrap">
            <button type="button" id="notificationsLoadMore" class="btn btn-secondary" hidden>
                Load More
            </button>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/notifications/app.js"></script>
</body>
</html>
