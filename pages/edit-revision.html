<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/logo/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Revision | Specbound</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar" id="navbar"></nav>

    <main class="upload-page" id="main">
        <section class="upload-hero">
            <p class="hero-badge">Edit Revision</p>
            <h1>Update this build log.</h1>
            <p>
                Document today's progress, upload new photos, and track what changed.
            </p>
        </section>

        <section class="upload-shell">
            <form id="revisionForm" class="upload-form">

                <div class="form-card">
                    <p class="hero-badge">Step 01</p>
                    <h2>Revision Details</h2>

                    <input id="title" type="text" placeholder="Revision Title" required>

                    <textarea id="description" placeholder="What changed in this revision?" rows="6" required></textarea>

                    <input id="version" type="text" placeholder="Version" value="v0.2" required>

                    <input id="timeSpent" type="text" placeholder="Time spent (ex: 2 hours)">
                </div>

                <div class="form-card">
                    <p class="hero-badge">Step 02</p>
                    <h2>Progress</h2>

                    <label class="form-label" for="progress">Build Progress</label>

                    <div class="progress-input">
                        <input id="progress" type="range" min="0" max="100" value="0">
                        <span id="progressValue">0%</span>
                    </div>
                </div>

                <div class="form-card">
                    <p class="hero-badge">Step 03</p>
                    <h2>Photos</h2>

                    <input id="image" type="file" accept="image/*">
                </div>

                <button class="btn btn-primary btn-large" type="submit">
                    Save Changes
                </button>

            </form>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="../js/pages/edit-revision/app.js"></script>
</html>
